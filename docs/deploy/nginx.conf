# Exemplo de vhost Nginx para o CRT Password Manager.
# - Serve o build estático do frontend (frontend/dist)
# - Faz proxy reverso de /api para a API Node (porta 3000, só localhost)
# - Redireciona HTTP -> HTTPS
#
# Ajuste `server_name`, os caminhos de certificado (geralmente geridos
# pelo certbot) e o caminho de `root` para o ambiente real.

server {
    listen 80;
    listen [::]:80;
    server_name senhas.crtcomunicacao.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name senhas.crtcomunicacao.com.br;

    ssl_certificate     /etc/letsencrypt/live/senhas.crtcomunicacao.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senhas.crtcomunicacao.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/crt-password-manager/frontend/dist;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo existente cai no
    # index.html, e o React Router assume o roteamento no cliente.
    location / {
        try_files $uri /index.html;
    }

    # Assets com hash no nome (Vite) podem ser cacheados por muito tempo.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
    }
}
